<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4c5cff" />
    <title>Flynn Notes – Settings</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/regular.min.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="options.css" />
    <link rel="stylesheet" href="premium.css" />
  </head>
  <body>
    <div id="shell">
      <aside id="side">
        <div class="brand">
          <span class="logo"><i class="fa-solid fa-feather-pointed"></i></span>
          <span class="bt"><b>Flynn Notes</b><small>Settings</small></span>
        </div>
        <nav id="nav" aria-label="Settings sections">
          <a href="#appearance"
            ><i class="fa-solid fa-palette"></i><span>Appearance</span></a
          >
          <a href="#typography"
            ><i class="fa-solid fa-font"></i><span>Typography</span></a
          >
          <a href="#colors"
            ><i class="fa-solid fa-fill-drip"></i><span>Colors</span></a
          >
          <a href="#editor"
            ><i class="fa-solid fa-pen-to-square"></i><span>Editor</span></a
          >
          <a href="#shortcuts"
            ><i class="fa-solid fa-keyboard"></i><span>Shortcuts</span></a
          >
          <a href="#storage"
            ><i class="fa-solid fa-folder-open"></i><span>Storage</span></a
          >
          <a href="#about"
            ><i class="fa-solid fa-circle-info"></i><span>About</span></a
          >
        </nav>
        <div class="side-foot">
          <i class="fa-solid fa-circle-check"></i
          ><span>Changes are saved automatically</span>
        </div>
      </aside>
      <main id="content">
        <section id="appearance"></section>
        <section id="typography"></section>
        <section id="colors"></section>
        <section id="editor"></section>
        <section id="shortcuts"></section>
        <section id="storage"></section>
        <section id="about"></section>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
